<form id="formulario">
	<div class="w-100"><input type="date" id="fecha" name="fecha"></div>
	<div class="w-100">
		<!-- Las opciones se cargan desde js/lista.json (ver script al final) -->
		<select id="pais" name="nacionalidad" class="form-select">
			<option value="-1">País o Nacionalidad</option>
		</select>
	</div>
	<div class="w-100 d-inline d-none">
		<div class="alert " id="errorMinimoPasajeros">⚠️ Mínimo de personas: <span id="spanMinimo"></span></div>
	</div>
	<div class="div w-100 d-inline">
		<div class="w-50 me-2">
			<input type="number" min="0" placeholder="Adultos" id="adultos" name="adultos">
		</div>
		<div class="w-50 ms-2">
			<input type="number" min="0" placeholder="Niños" id="niños" name="niños">
		</div>
	</div>
	<div class="w-100">
		<select id="documento" name="documento">
			<option value="D.N.I.">D.N.I.</option>
		</select>
	</div>
	<div class="w-100">
		<input type="text" id="numeroDocumento" name="numeroDocumento" placeholder="Número de D.N.I." autocomplete="off">
	</div>
	<div class="w-100"><input type="text" name="nombre" id="nombres" placeholder="Nombres y Apellidos"></div>
	<div class="w-100"><input type="text" name="celular" id="celular" placeholder="Celular"></div>
	<div class="w-100"><input type="text" name="email" id="email" placeholder="Email"></div>
	<div class="w-100"><input type="text" name="direccion" id="direccion" placeholder="Dirección"></div>
	<div class="w-100"><input type="text" name="ciudad" id="ciudad" placeholder="Ciudad"></div>
	<div class="w-100 d-inline d-none" id="contenedorErrorDatos">
		<div class="alert">⚠️ <span id="spanErrorDatos"></span></div>
	</div>
	<div class="div w-100 d-inline">
		<div class="w-50 me-2">
			<button type="submit" class="btn d-inline" id="reservar"><span class="elementor-button-icon">
				<i class="lnr lnr-cart" aria-hidden="true"></i>
			</span> Reservar</button>
		</div>
		<div class="w-50 ms-2">
			<button class="btn d-inline" id="whatsapp" onclick="enviarWhatsapp()">
				<svg aria-hidden="true" fill="white" class="e-font-icon-svg e-fab-whatsapp" viewBox="0 0 448 512" style="width: 28.8px; height: 28.8px;" xmlns="http://www.w3.org/2000/svg"><path d="M380.9 97.1C339 55.1 283.2 32 223.9 32c-122.4 0-222 99.6-222 222 0 39.1 10.2 77.3 29.6 111L0 480l117.7-30.9c32.4 17.7 68.9 27 106.1 27h.1c122.3 0 224.1-99.6 224.1-222 0-59.3-25.2-115-67.1-157zm-157 341.6c-33.2 0-65.7-8.9-94-25.7l-6.7-4-69.8 18.3L72 359.2l-4.4-7c-18.5-29.4-28.2-63.3-28.2-98.2 0-101.7 82.8-184.5 184.6-184.5 49.3 0 95.6 19.2 130.4 54.1 34.8 34.9 56.2 81.2 56.1 130.5 0 101.8-84.9 184.6-186.6 184.6zm101.2-138.2c-5.5-2.8-32.8-16.2-37.9-18-5.1-1.9-8.8-2.8-12.5 2.8-3.7 5.6-14.3 18-17.6 21.8-3.2 3.7-6.5 4.2-12 1.4-32.6-16.3-54-29.1-75.5-66-5.7-9.8 5.7-9.1 16.3-30.3 1.8-3.7.9-6.9-.5-9.7-1.4-2.8-12.5-30.1-17.1-41.2-4.5-10.8-9.1-9.3-12.5-9.5-3.2-.2-6.9-.2-10.6-.2-3.7 0-9.7 1.4-14.8 6.9-5.1 5.6-19.4 19-19.4 46.3 0 27.3 19.9 53.7 22.6 57.4 2.8 3.7 39.1 59.7 94.8 83.8 35.2 15.2 49 16.5 66.6 13.9 10.7-1.6 32.8-13.4 37.4-26.4 4.6-13 4.6-24.1 3.2-26.4-1.3-2.5-5-3.9-10.5-6.6z"></path></svg> Whatsapp
			</button>
		</div>
	</div>
</form>
<script>
	jQuery(document).ready(function($) {
		fecha = document.querySelector('#fecha')
		adultos = document.querySelector('#adultos').value || 0
		niños = document.querySelector('#niños').value || 0
		nombres = document.querySelector('#nombres')
		celular = document.querySelector('#celular')
		email = document.querySelector('#email')
		ciudad = document.querySelector('#ciudad')
		direccion = document.querySelector('#direccion')
		documento = document.querySelector('#documento')
		numeroDocumento = document.querySelector('#numeroDocumento')
		paisSelect = document.querySelector('#pais')
		pagina = document.title.replace(' – Tours Huancayo', '');
		minimo_pasajeros = parseInt(document.querySelector('#minimo-pasajeros').dataset.minimo || 1)

		// Lista de países cargada desde js/lista.json
		let paisesCargados = []

		const hoy = new Date().toISOString().slice(0, 10);
		document.querySelector('#spanMinimo').innerText=minimo_pasajeros
		fecha.value = hoy

		// ===== Lista de países (js/lista.json) =====
		// Si la página ya cargó paises.js (PAISES_DATA) se reutiliza esa lista,
		// si no, se descarga el archivo js/lista.json del MISMO servidor donde
		// está abierto el formulario (sin rutas de app/render escritas a mano)
		const ID_PERU = 140

		// [Servidor] donde vive el formulario: https://www.tourshuancayo.com
		// (location.origin entrega protocolo + dominio + puerto automáticamente)
		const SERVIDOR = (typeof window !== 'undefined' && window.location)
			? (window.location.origin || (window.location.protocol + '//' + window.location.host))
			: ''

		const RUTAS_LISTA = [
			'js/lista.json',                          // relativo a la página actual
			SERVIDOR + '/js/lista.json',              // [Servidor]/js/lista.json
			SERVIDOR.replace('//www.', '//') + '/js/lista.json' // sin "www." por si acaso
		].filter( (ruta, i, todas) => ruta && todas.indexOf(ruta) === i )

		const pintarPaises = (lista)=>{
			if( !Array.isArray(lista) || lista.length === 0 ) return

			paisesCargados = lista
			paisSelect.innerHTML = '<option value="-1">País o Nacionalidad</option>' +
				lista.map( p => `<option value="${p.id}">${p.pais}</option>` ).join('')
		}

		const cargarPaises = async ()=>{
			// 1. La lista que ya sirve el sitio para los demás formularios
			if( typeof PAISES_DATA !== 'undefined' ) return pintarPaises(PAISES_DATA)
			if( typeof LISTA_PAISES !== 'undefined' ) return pintarPaises(LISTA_PAISES)

			// 2. El archivo propio de este formulario
			for( const ruta of RUTAS_LISTA ){
				try{
					const res = await fetch(ruta)
					if( !res.ok ) continue
					return pintarPaises( await res.json() )
				}catch(e){ /* se prueba la siguiente ruta */ }
			}

			console.warn('No se pudo cargar la lista de países desde ' + (SERVIDOR || '') + '/js/lista.json')
		}

		// Nombre del país elegido: se lee del propio <select> (así funciona
		// aunque la lista se haya pegado a mano) y, si no, del arreglo cargado
		const nombrePais = (id)=>{
			if( isNaN(id) || id < 0 ) return ''

			const opcion = Array.from(paisSelect.options)
				.find( o => String(o.value) === String(id) )

			if( opcion && opcion.textContent.trim() !== '' ) return opcion.textContent.trim()

			const p = paisesCargados.find( x => String(x.id) === String(id) )
			return p ? p.pais : ''
		}

		// Perú (id 140) -> D.N.I. | Cualquier otro país -> Carnet de extranjería o Pasaporte
		const esPeru = ()=> String(paisSelect.value) === String(ID_PERU)

		cargarPaises()

		// ===== Tipo de documento según el país =====
		const TIPOS_DOCUMENTO = {
			peru: ['D.N.I.'],
			extranjero: ['Carnet de extranjería', 'Pasaporte']
		}

		// Placeholder del número según el tipo de documento elegido
		const PLACEHOLDER_DOC = {
			'D.N.I.': 'Número de D.N.I.',
			'Carnet de extranjería': 'Número de carnet de extranjería',
			'Pasaporte': 'Número de pasaporte'
		}

		const actualizarDocumento = ()=>{
			// Sin país elegido se mantiene D.N.I. (como antes); con Perú se pide
			// D.N.I. y con cualquier otro país, carnet de extranjería o pasaporte
			const opciones = ( paisSelect.value === '-1' || esPeru() )
				? TIPOS_DOCUMENTO.peru
				: TIPOS_DOCUMENTO.extranjero

			documento.innerHTML = opciones
				.map( op => `<option value="${op}">${op}</option>` )
				.join('')

			// El campo se vacía porque un documento de otro país ya no es válido
			numeroDocumento.value = ''
			actualizarPlaceholderDoc()
		}

		const actualizarPlaceholderDoc = ()=>{
			numeroDocumento.placeholder = PLACEHOLDER_DOC[documento.value] || 'Número de documento'
		}

		paisSelect.addEventListener('change', actualizarDocumento)
		documento.addEventListener('change', actualizarPlaceholderDoc)
		actualizarDocumento()
		actualizarPlaceholderDoc()

		// ===== Precio del tour (#precio en la página, ej: "95" a secas) =====
		const leerPrecio = ()=>{
			const el = document.querySelector('#precio')
			if( !el ) return 0

			// Sirve tanto para <input> (value) como para <span>/<div> (textContent)
			const crudo = (el.value !== undefined && el.value !== null && el.value !== '')
				? el.value
				: el.textContent

			// Limpia "S/ 95.00" -> 95.00  |  "1,250.50" -> 1250.50
			const limpio = String(crudo)
				.replace(/[^0-9.,]/g, '')
				.replace(/,(\d{3})(?=\D|$)/g, '$1')
				.replace(',', '.')

			const num = parseFloat(limpio)
			return isNaN(num) ? 0 : num
		}

		const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/

		const mostrarErrorDatos = (mensaje)=>{
			document.querySelector('#spanErrorDatos').innerText = mensaje
			document.querySelector('#contenedorErrorDatos').classList.remove('d-none')
		}

		const ocultarErrorDatos = ()=>{
			document.querySelector('#contenedorErrorDatos').classList.add('d-none')
		}

		const mostrarErrorMinimo = ()=>{
			document.querySelector('#errorMinimoPasajeros').parentNode.classList.remove('d-none')
			document.querySelector('#adultos').classList.add('error')
			document.querySelector('#niños').classList.add('error')
		}

		const ocultarErrorMinimo = ()=>{
			document.querySelector('#errorMinimoPasajeros').parentNode.classList.add('d-none')
			document.querySelector('#adultos').classList.remove('error')
			document.querySelector('#niños').classList.remove('error')
		}

		// Limpia las marcas de la validación anterior
		// (se recorren todos los campos para no olvidar ninguno al agregar nuevos)
		const limpiarErrores = ()=>{
			document.querySelectorAll('#formulario input, #formulario select')
				.forEach( el => el.classList.remove('error') )
			ocultarErrorDatos()
			ocultarErrorMinimo()
		}

		// Las validaciones siguen el mismo orden en que aparecen los campos:
		// país, documento, adultos, niños, nombres, celular, email
		const validarDatos = ()=>{
			limpiarErrores()

			// 1. País o nacionalidad
			if( paisSelect.value === '-1' || paisSelect.value === '' ){
				paisSelect.classList.add('error')
				mostrarErrorDatos('Selecciona tu país o nacionalidad')
				return false
			}

			// 2. Número de documento
			if( !numeroDocumento.value.trim() ){
				numeroDocumento.classList.add('error')
				mostrarErrorDatos(`Completa el número de ${documento.value}`)
				return false
			}

			// 3. Adultos y niños
			const adultosVal = parseInt(document.querySelector('#adultos').value) || 0
			const niñosVal   = parseInt(document.querySelector('#niños').value) || 0

			if( adultosVal + niñosVal < minimo_pasajeros ){
				mostrarErrorMinimo()
				return false
			}

			// 4. Nombres, celular, email, ciudad y direccion
			const obligatorios = [
				{ campo: nombres,   nombre: 'Nombres' },
				{ campo: celular,   nombre: 'Celular' },
				{ campo: email,     nombre: 'Email' },
				{ campo: ciudad,    nombre: 'Ciudad' },
				{ campo: direccion, nombre: 'Dirección' }
			]

			const faltantes = obligatorios
				.filter( o => !o.campo.value.trim() )
				.map( o => o.nombre )

			if( faltantes.length > 0 ){
				obligatorios.forEach( o => o.campo.classList.toggle('error', faltantes.includes(o.nombre)) )
				mostrarErrorDatos(`Completa los datos obligatorios: ${faltantes.join(', ')}`)
				return false
			}

			// 5. Formato del email
			if( !emailRegex.test(email.value.trim()) ){
				email.classList.add('error')
				mostrarErrorDatos('Ingresa un email válido, por ejemplo: algo@correo.com')
				return false
			}

			return true
		}

		window.enviarWhatsapp = ()=>{		
			event.preventDefault();
			if( !validarDatos() ) return
			adultos = document.querySelector('#adultos').value || 0
			niños = document.querySelector('#niños').value || 0

			// Se lee del select #pais al momento de enviar
			const paisWhatsapp = nombrePais( parseInt(paisSelect.value) )

			// Precio leído de #precio al momento de enviar (0 si no existe)
			const precioWhatsapp = leerPrecio()
			const pasajerosWhatsapp = (parseInt(adultos) || 0) + (parseInt(niños) || 0)

			// Solo se agregan las líneas que tienen contenido
			const lineas = [
				`Con fecha: ${fecha.value}`,
				`País: ${paisWhatsapp}`,
				numeroDocumento.value.trim() ? `Documento: ${documento.value} - ${numeroDocumento.value.trim()}` : '',
				`Pasajes: ${adultos} (adultos) y ${niños} (niños)`,
				precioWhatsapp > 0 ? `Precio por persona: S/ ${precioWhatsapp.toFixed(2)}` : '',
				`Nombres: ${nombres.value}`,
				`Celular: ${celular.value}`,
				`Email: ${email.value}`,
				ciudad.value.trim()    ? `Ciudad: ${ciudad.value.trim()}` : '',
				direccion.value.trim() ? `Dirección: ${direccion.value.trim()}` : '',
				precioWhatsapp > 0 ? `Total a pagar: S/ ${(precioWhatsapp * pasajerosWhatsapp).toFixed(2)}` : ''
			].filter( linea => linea !== '' )

			const mensaje = `*Hola Tours Huancayo* Quisiera más hacer una reservación del tour: *${pagina}*\n`+
			lineas.join('\n');

			const url = `https://wa.me/51993183661?text=${encodeURIComponent(mensaje)}`;
			window.open(url, '_blank');
		}

		document.getElementById('formulario').addEventListener('submit', function(e) {
			e.preventDefault();
			adultos = document.querySelector('#adultos').value || 0
			niños = document.querySelector('#niños').value || 0

			let personas = parseInt(adultos) + parseInt(niños)

			if( !validarDatos() ) return

			// País elegido (140 = Perú). Se guarda el NOMBRE del país para
			// mostrarlo en la columna de compra y en el correo
			const paisId = parseInt(paisSelect.value)
			const paisNombre = nombrePais(paisId)
			const nacionalidadVal = paisId === ID_PERU ? 'Peruana' : 'Extranjera'

			// Convertimos la fecha de yyyy-mm-dd (input date) a dd/mm/yyyy
			let fechaFormato = fecha.value;
			if (fechaFormato && fechaFormato.includes('-')) {
				const [yyyy, mm, dd] = fechaFormato.split('-');
				fechaFormato = `${dd}/${mm}/${yyyy}`;
			}

			// Armamos el objeto con todos los datos del formulario + datos de la página
			const precioUnitario = leerPrecio()

			const datosTour = {
				fecha:        fechaFormato,
				paisId:       paisId,
				pais:         paisNombre,
				nacionalidad: nacionalidadVal,
				documento:    documento.value,
				numeroDocumento: numeroDocumento.value.trim(),
				precio:       precioUnitario,
				total:        precioUnitario * personas,
				adultos:      parseInt(adultos) || 0,
				niños:        parseInt(niños) || 0,
				pasajeros:    personas,
				nombres:      nombres.value,
				celular:      celular.value,
				email:        email.value,
				ciudad:       ciudad.value.trim(),
				direccion:    direccion.value.trim(),
				pagina:       pagina,
				titulo:       document.title,
				url:          window.location.href,
				fechaRegistro: new Date().toISOString()
			};

			// Guardamos en localStorage como JSON
			localStorage.setItem('tour-infocat', JSON.stringify(datosTour));

			// Redirigimos a la pantalla de pago
			location.href = '/pago-final/';
		});
	});
</script>
